<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SysAdmin Cheatsheet</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5edf8;font:15px/1.6 system-ui,sans-serif}header{border-bottom:1px solid #26354b;padding:32px max(20px,calc((100% - 1120px)/2));background:#101b2c}h1{font-size:clamp(24px,4vw,38px);margin:0;letter-spacing:-1px}p{margin:5px 0;color:#a8b8ce}.eyebrow{color:#5eead4;font:13px monospace;letter-spacing:2px}main{max-width:1160px;margin:auto;padding:24px 20px}nav,.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}button,input{font:inherit}button{cursor:pointer;border:1px solid #34465f;background:#172439;color:#e5edf8;border-radius:8px;padding:8px 13px}button:hover,button:focus-visible{border-color:#5eead4}button.active{background:#153c40;color:#8df7e7;border-color:#377e7c}input{width:100%;padding:14px;background:#101b2c;border:1px solid #34465f;color:#fff;border-radius:9px;margin-bottom:16px}#count{margin-bottom:14px;color:#a8b8ce}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:14px}article{min-width:0;background:#101b2c;border:1px solid #26354b;border-radius:12px;padding:17px}h2{font-size:17px;margin:6px 0 12px}.tag{font:12px monospace;color:#5eead4}.code{display:flex;align-items:start;gap:8px;background:#080e18;border-radius:8px;padding:12px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-width:0;color:#c4f1d9;font:13px/1.6 ui-monospace,monospace}.copy{font-size:12px;padding:5px 9px;flex-shrink:0}footer{max-width:1160px;margin:auto;padding:24px 20px;color:#a8b8ce}a{color:#5eead4}.empty{padding:35px;border:1px dashed #34465f;border-radius:12px}small{color:#a8b8ce}</style></head><body><header><div class="eyebrow">TERMINAL / KNOWLEDGE BASE</div><h1>SysAdmin &amp; DevOps Cheatsheet</h1><p>Tra cứu nhanh · Copy câu lệnh · Troubleshooting Linux</p></header><main><nav id="tabs" aria-label="Danh mục"></nav><input id="search" type="search" placeholder="Tìm câu lệnh, ví dụ: nginx, grep, IP, log..." aria-label="Tìm câu lệnh"><div class="filters" id="filters"></div><div id="count" aria-live="polite"></div><section id="cards"></section></main><footer>Kiểm tra tham số và đường dẫn trước khi chạy trên production. · <a href="https://github.com/ryanit-sys/sysadmin-cheatsheet">GitHub repository</a></footer><script>
const commands=[["grep","Tìm từ khóa trong log","grep -in 'error' application.log","-i bỏ phân biệt hoa thường; -n hiện số dòng."],["grep","Tìm nhiều từ khóa OR","grep -Ei 'error|failed|timeout' application.log","Khớp ít nhất một từ khóa."],["grep","Tìm nhiều từ khóa AND","grep -i 'error' application.log | grep -i 'database'","Khớp cả hai từ khóa."],["grep","Loại bỏ comment và dòng trống","grep -Ev '^[[:space:]]*(#|$)' /etc/ssh/sshd_config","Xem cấu hình gọn hơn; không sửa file."],["grep","Tìm IP trong thư mục cấu hình","grep -rnF --include='*.conf' '192.168.1.100' /etc/","-F tìm chuỗi nguyên văn."],["grep","Xem ngữ cảnh lỗi","grep -inC 5 'error' application.log","Hiện 5 dòng trước và sau."],["grep","Lọc module Nginx theo phiên bản","nginx -V 2>&1 | grep -oE '[^[:space:]]*0\\.0\\.20rc4[^[:space:]]*'","Nginx -V ghi ra stderr; chỉ lấy tham số chứa phiên bản."],["grep","Chỉ lấy phiên bản Nginx module","nginx -V 2>&1 | grep -oF '0.0.20rc4'","Chỉ in chuỗi khớp."],["grep","Đếm dòng lỗi","grep -ic 'error' application.log","Đếm dòng, không đếm số lần xuất hiện."],["grep","Đếm số lần xuất hiện","grep -oi 'error' application.log | wc -l","Đếm từng kết quả khớp."],["grep","Theo dõi log realtime","tail -F /var/log/syslog | grep --line-buffered -Ei 'error|failed|timeout'","Đường dẫn log tùy distro."],["grep","Tìm log nén","zgrep -i 'error' /var/log/syslog*.gz","Không cần giải nén."],["grep","Trích xuất IPv4","grep -Eo '([0-9]{1,3}\\.){3}[0-9]{1,3}' access.log","Chỉ khớp định dạng, không xác thực octet."],["find","Tìm file theo tên","find /etc -type f -iname '*.conf'","Không phân biệt hoa thường."],["find","Tìm file sửa trong 24 giờ","find /var/log -type f -mmin -1440","Dựa trên thời gian sửa nội dung."],["find","Tìm file lớn hơn 100 MiB","find /var/log -type f -size +100M","Chỉ liệt kê, không xóa."],["find","Tìm nội dung trong file","find /etc -type f -name '*.conf' -exec grep -nHF 'listen' {} +","Gộp nhiều file mỗi lần gọi grep."],["awk","Lấy cột đầu tiên","awk '{print $1}' access.log","Mặc định phân tách bằng khoảng trắng."],["awk","Lọc HTTP 500","awk '$9 == 500' /var/log/nginx/access.log","Giả định log định dạng combined chuẩn."],["awk","Lấy user và shell","awk -F: '{print $1, $7}' /etc/passwd","Phân tách bằng dấu hai chấm."],["sed","Xem dòng 10 đến 20","sed -n '10,20p' application.log","Không sửa file."],["sed","Thay thế chuỗi khi hiển thị","sed 's/old/new/g' application.log","Không dùng -i nên không sửa file gốc."],["cut","Trích xuất tên user","cut -d: -f1 /etc/passwd","Lấy trường đầu tiên."],["sort / uniq","Top 10 IP truy cập","awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -nr | head -10","Giả định IP ở cột đầu."],["sort / uniq","Loại bỏ dòng trùng","sort -u application.log","Kết quả được sắp xếp."],["xargs","Tìm kiếm an toàn với tên file có dấu cách","find /etc -type f -name '*.conf' -print0 | xargs -0 -r grep -nH 'listen'","GNU xargs; phân tách bằng NUL."],["journalctl","Tìm lỗi dịch vụ hôm nay","journalctl -u nginx --since today -p err --no-pager","Lọc theo mức ưu tiên journal."],["journalctl","Tìm từ khóa trong log dịch vụ","journalctl -u nginx --since '1 hour ago' --no-pager | grep -Ei 'error|failed'","Lọc nội dung trong một giờ."],["grep","Kiểm tra process","ps aux | grep '[n]ginx'","Tránh khớp chính lệnh grep."],["grep","Kiểm tra port 443","ss -lntp | grep ':443 '","Chỉ kiểm tra TCP listening; có thể cần root."]];
const networkingCommands=[["Open vSwitch","Kiểm tra topology OVS","ovs-vsctl show","Hiển thị bridge, port và interface."],["Open vSwitch","Kiểm tra QoS hiện tại","ovs-vsctl get Port fwln9990o0 qos\novs-vsctl list QoS\novs-vsctl list Queue","Kiểm tra UUID và tham chiếu trước khi thay đổi; không ghi đè QoS đang dùng nếu chưa có kế hoạch rollback."],["Open vSwitch","Giới hạn egress 40 Mbps (HTB)","ovs-vsctl -- set Port fwln9990o0 qos=@newqos -- \\\n  --id=@newqos create QoS external_ids:name=limit40m type=linux-htb other-config:max-rate=40000000 queues:0=@q0 -- \\\n  --id=@q0 create Queue external_ids:name=limit40m other-config:max-rate=40000000","Linux HTB trên datapath hỗ trợ; max-rate tính bằng bit/s. Egress là chiều từ switch ra port. Lệnh tạo bản ghi mới mỗi lần chạy."],["Open vSwitch","Giới hạn ingress 40 Mbps","ovs-vsctl set Interface fwln9990o0 ingress_policing_rate=40000 ingress_policing_burst=4000","Rate tính bằng kbit/s; burst tính bằng kbit (ví dụ 10% rate). Policing loại bỏ gói vượt ngưỡng, không shaping."],["Open vSwitch","Kiểm tra ingress policing","ovs-vsctl get Interface fwln9990o0 ingress_policing_rate ingress_policing_burst","Kiểm tra rate và burst đã cấu hình."],["Open vSwitch","Kiểm tra hàng đợi và traffic control","ovs-appctl qos/show fwln9990o0\ntc -s qdisc show dev fwln9990o0\ntc -s class show dev fwln9990o0","Kiểm tra trên Linux datapath; dùng iperf3 hai chiều để xác minh throughput thực tế."],["Open vSwitch","Gỡ ingress policing","ovs-vsctl set Interface fwln9990o0 ingress_policing_rate=0 ingress_policing_burst=0","Tắt giới hạn ingress."],["Open vSwitch","Gỡ QoS khỏi port","ovs-vsctl clear Port fwln9990o0 qos","Gỡ tham chiếu QoS; lưu UUID trước khi gỡ để dọn bản ghi không còn dùng."],["Open vSwitch","Xóa QoS và Queue không còn sử dụng","ovs-vsctl -- destroy QoS <QOS_UUID> -- destroy Queue <QUEUE_UUID>","Thay placeholder bằng UUID thực tế, không nhập dấu ngoặc nhọn. Chỉ xóa sau khi xác nhận không còn port/QoS khác tham chiếu; không dùng tên port thay UUID."],["Open vSwitch","Tìm UUID theo tên limit40m","ovs-vsctl --columns=_uuid,external_ids find QoS external_ids:name=limit40m\novs-vsctl --columns=_uuid,external_ids find Queue external_ids:name=limit40m","Có thể có nhiều kết quả; đối chiếu với port và queue map trước khi xóa."]];
const tabs=['Search Commands','Linux','Networking','Ceph','Proxmox','Docker','Kubernetes','Services','CVE Watch'];let tab=tabs[0],filter='All';const $=id=>document.getElementById(id);
function button(label,active,fn){const b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.setAttribute('aria-pressed',String(active));b.onclick=fn;return b}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function render(){ $('tabs').replaceChildren(...tabs.map(t=>button(t,t===tab,()=>{if(t==='CVE Watch'){location.href='cve.html';return}tab=t;filter='All';$('search').value='';render()})));const dataset=tab===tabs[0]?commands:tab==='Networking'?networkingCommands:[];const ready=dataset.length>0;$('search').hidden=!ready;$('filters').replaceChildren(...(ready?['All',...new Set(dataset.map(c=>c[0]))].map(f=>button(f,f===filter,()=>{filter=f;render()})):[]));const q=normalize($('search').value.trim());const results=ready?dataset.filter(c=>(filter==='All'||c[0]===filter)&&normalize(c.join(' ')).includes(q)):[];$('count').textContent=ready?results.length+' / '+dataset.length+' câu lệnh':'';$('cards').replaceChildren();if(!results.length){const p=document.createElement('p');p.className='empty';p.textContent=ready?'Không tìm thấy câu lệnh.':'Danh mục '+tab+' sẽ được bổ sung sau.';$('cards').append(p);return}for(const [group,title,cmd,note] of results){const a=document.createElement('article'),tag=document.createElement('span'),h=document.createElement('h2'),code=document.createElement('div'),pre=document.createElement('pre'),p=document.createElement('p');tag.className='tag';tag.textContent=group;h.textContent=title;code.className='code';pre.textContent=cmd;p.textContent=note;const b=button('Copy',false,async()=>{try{await navigator.clipboard.writeText(cmd);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500)}catch(e){b.textContent='Copy thủ công';const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)}});b.className='copy';code.append(pre,b);a.append(tag,h,code,p);$('cards').append(a)}}$('search').addEventListener('input',render);render();
</script></body></html>
