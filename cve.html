<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVE Watch | SysAdmin</title><style>body{background:#0b1220;color:#e5edf8;font:15px/1.6 system-ui;margin: auto;max-width:1120px;padding:24px}a{color:#5eead4}article{background:#101b2c;border:1px solid #26354b;border-radius:12px;padding:16px;margin:12px 0}input,select{background:#172439;color:white;border:1px solid #34465f;padding:12px;border-radius:8px;margin:5px}input{width:min(90%,420px)}small{color:#a8b8ce}h2{font-size:18px}</style><a href="index.html">← SysAdmin Cheatsheet</a><h1>CVE Watch</h1><p>CVE công bố trong 7 ngày gần nhất · NVD / CISA KEV · cập nhật mỗi ngày</p><p><a href="https://nvd.nist.gov/">NVD</a> · <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">CISA KEV</a></p><input id="q" placeholder="Tìm CVE, Linux, OpenSSH, Ceph..." aria-label="Tìm CVE"><select id="s" aria-label="Mức độ"><option value="">Tất cả</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option><option>KEV</option></select><p id="status" role="status">Đang tải dữ liệu...</p><main id="items"></main><script>
let data;const q=document.getElementById('q'),s=document.getElementById('s'),items=document.getElementById('items'),status=document.getElementById('status');function render(){if(!data)return;const rows=data.items.filter(x=>(!s.value||(s.value==='KEV'?x.kev:x.severity===s.value))&&(x.id+' '+x.description).toLowerCase().includes(q.value.toLowerCase()));status.textContent='Cập nhật: '+new Date(data.updated).toLocaleString('vi-VN')+' | '+rows.length+'/'+data.items.length+' CVE';items.replaceChildren();for(const x of rows){const a=document.createElement('article'),h=document.createElement('h2'),link=document.createElement('a'),m=document.createElement('small'),p=document.createElement('p');link.href='https://nvd.nist.gov/vuln/detail/'+encodeURIComponent(x.id);link.textContent=x.id;h.append(link);m.textContent=x.severity+' | CVSS '+(x.score??'N/A')+' | '+x.published.slice(0,10)+(x.kev?' | CISA KEV: đã bị khai thác':'');p.textContent=x.description;a.append(h,m,p);items.append(a)}}q.oninput=s.onchange=render;fetch('data/cve.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;render()}).catch(()=>status.textContent='Chưa có dữ liệu hoặc tải thất bại. Kiểm tra GitHub Actions và nguồn NVD.');
</script></html>
