name: Daily CVE refresh
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cve.yml'
      - 'scripts/update_cve.py'
permissions:
  contents: write
concurrency:
  group: cve-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/update_cve.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cve.json
          git diff --cached --quiet || git commit -m "Refresh CVE feed"
          git pull --rebase
          git push
